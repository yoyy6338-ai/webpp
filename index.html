<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #fff;
  }

  .container {
    width: 100%;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 30px 25px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  }

  .profile {
    text-align: center;
    margin-bottom: 25px;
  }

  .profile img {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 3px solid #6a5acd;
    object-fit: cover;
    margin-bottom: 12px;
    background: #1a1a2e;
  }

  .profile h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .profile p {
    font-size: 13px;
    color: #b8b8d0;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .link-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 15px 18px;
    background: rgba(255, 255, 255, 0.07);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    text-decoration: none;
    color: #fff;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
  }

  .link-item:hover {
    background: rgba(255, 255, 255, 0.14);
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(106, 90, 205, 0.35);
  }

  .link-item .icon {
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    flex-shrink: 0;
  }

  .link-item .icon svg {
    width: 24px;
    height: 24px;
    fill: #fff;
  }

  .link-item .text {
    flex: 1;
    text-align: left;
  }

  .link-item .text .title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .link-item .text .sub {
    font-size: 12px;
    color: #b8b8d0;
  }

  .link-item .arrow {
    font-size: 18px;
    color: #8a7ff0;
    transition: transform 0.25s;
  }

  .link-item:hover .arrow {
    transform: translateX(4px);
  }

  /* Warna icon per platform */
  .wa-chat  { background: linear-gradient(135deg, #25D366, #128C7E); }
  .wa-chan  { background: linear-gradient(135deg, #128C7E, #075E54); }
  .tg       { background: linear-gradient(135deg, #229ED9, #1c7fb0); }
  .tt       { background: linear-gradient(135deg, #000000, #25F4EE); }

  .footer {
    text-align: center;
    margin-top: 25px;
    font-size: 11px;
    color: #7a7a95;
  }
</style>
